name: hunt

on:
  schedule:
    - cron: "0 6 * * *"     # compte rendu quotidien, 7h/8h heure de Paris
    - cron: "30 */2 * * *"  # toutes les 2 h : ne fait quelque chose que si le Grimoire a publié
  workflow_dispatch:
    inputs:
      force:
        description: "Agir maintenant, même sans nouveau mail du Grimoire"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: hunt

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (épinglé : le job voit la clé du wallet)
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: npm install -g @anthropic-ai/claude-code@2.1.314
      # l'agent n'agit que si la variable AGENT_EXECUTE vaut true (Settings → Variables) : c'est l'interrupteur
      - run: >-
          uv run hunter.py hunt --send
          ${{ vars.AGENT_EXECUTE == 'true' && '--execute' || '' }}
          ${{ inputs.force && '--force' || '' }}
          ${{ github.event.schedule == '30 */2 * * *' && '--if-mail' || '' }}
        env:
          PK_AGENT: ${{ secrets.PK_AGENT }}
          MAX_TX_USD: ${{ vars.MAX_TX_USD || '25' }}
          MAX_DAY_USD: ${{ vars.MAX_DAY_USD || '50' }}
          HYPE_BUDGET_USD: ${{ vars.HYPE_BUDGET_USD || '50' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # abonnement Claude, pas de crédits API
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: commit tracker
        run: |
          git config user.name "Sn0opyDr0p"
          git config user.email "actions@users.noreply.github.com"
          git add TRACKER.md REPORT.md state.json
          git diff --cached --quiet || git commit -m "hunt: $(date -u +%F)"
          git push
