name: hunt

on:
  schedule:
    - cron: "0 6 * * *"  # 7h/8h heure de Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency: hunt

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run hunter.py hunt --send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: commit tracker
        run: |
          git config user.name "Sn0opyDr0p"
          git config user.email "actions@users.noreply.github.com"
          git add TRACKER.md REPORT.md state.json
          git diff --cached --quiet || git commit -m "hunt: $(date -u +%F)"
          git push
